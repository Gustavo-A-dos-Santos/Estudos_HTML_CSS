<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        .container {
            position: relative;
            background-color: bisque;
            width: 100%;
            height: 400px;
            display: inline-block;
        }

        .div1 {
            position:relative ;

            background-color: yellow;
            display: inline-block;
            width: 30%;
            height: 100px;
            /*z-index: Serve Para colocar um elemento acima do outro*/
    
        }

        .div2 {
            position: sticky;
            top: 0;
            background-color: rgb(59, 42, 158);
            display: inline-block;          
            width: 30%;
            height: 100px;
            position: sticky;
     
        }

        .div3 {
            background-color: rgb(0, 157, 255);
            display: inline-block;
            width: 30%;
            height: 100px;
            position: absolute;
            top : 150px;
            right: 40%;
        }
        .whats{
            background-color: green;
            color:aliceblue;
            width: 80px;
            height: 80px;
            position: fixed;
            bottom: 10px;
            right: 10px;  
            text-align: center;
           
        }
    </style>
</head>
<style>

</style>

<body>

   <h1>Aprendendo sobre Position</h1> 

    <div class="container">
        <div class="div1">Primeira div</div>
        <div class="div2">Segunda div</div>
        <div class="div3">terceira div</div>

    </div>

    <!-- EXEMPLO DE POSITION FIXED -->
    <div class="whats">
            whats
    </div>

</body>

</html>
